name: Seed GeoNames cities

# Run this once after creating your Supabase project. Populates countries,
# admin1 regions, and ~26,000 cities with population > 15k from GeoNames.
# No terminal needed — use the "Run workflow" button in the Actions tab.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "YES" to confirm. This will overwrite existing city data.'
        required: true
        default: 'NO'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  seed:
    if: ${{ inputs.confirm == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Preflight — check required secrets are set
        run: |
          ok=1
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Secret SUPABASE_URL is not set. Add it under repo Settings → Secrets and variables → Actions."
            ok=0
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY is not set. Add it under repo Settings → Secrets and variables → Actions."
            ok=0
          fi
          if [ "$ok" = "0" ]; then
            exit 1
          fi
          echo "SUPABASE_URL set: yes"
          echo "SUPABASE_SERVICE_ROLE_KEY set: yes"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Run GeoNames import
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/import-geonames.ts

      - name: Summary
        run: echo "Done. Check your Supabase project -> Table editor -> cities to see the new rows."
